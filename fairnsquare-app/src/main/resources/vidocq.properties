# FairNSquare configuration. %dev. keys apply in dev mode (MicroProfile profile dev, set in the pom).
# Environment variables outrank this file: FAIRNSQUARE_DATA_PATH sets
# fairnsquare.data.path, CAPTCHA_SECRET sets captcha.secret, and so on (MicroProfile Config's mapping).

# HTTP
vidocq.http.port=8080

# REST resources live under /api, leaving / to the frontend.
vidocq.rest.context-path=/api

# Frontend: web components served from META-INF/resources. frontend: vidocq's static files, with index.html for the
# frontend's own URLs (/splits/..., /admin), which the browser routes (FrontendMount).
vidocq.http.mount.ui.type=frontend
vidocq.http.mount.ui.path=/
vidocq.http.mount.ui.classpath=META-INF/resources
# The page and the web component scripts have no content hash in their names: the browser must revalidate them on
# each load (304 when unchanged), or after a deploy it mixes old and new modules (#178).
vidocq.http.mount.ui.cache-control=no-cache

# Application info
fairnsquare.application.name=fairnsquare
fairnsquare.application.version=1.0.0-SNAPSHOT
app.git.commit=unknown

# Data storage path
fairnsquare.data.path=data

# Storage constraints. Their variables don't follow MicroProfile's mapping (FAIRNSQUARE_STORAGE_...), hence the
# expressions: the names the deployments already set.
fairnsquare.storage.max-file-count=${FAIRNSQUARE_MAX_FILE_COUNT:5000}
fairnsquare.storage.max-file-size-bytes=${FAIRNSQUARE_MAX_FILE_SIZE_BYTES:524288}
fairnsquare.storage.max-file-age-days=${FAIRNSQUARE_MAX_FILE_AGE_DAYS:90}

# CAPTCHA. The HMAC-SHA256 signing secret has no default: production sets CAPTCHA_SECRET, and the application refuses
# to start without it. Dev mode (mvn compile vidocq:dev) uses a known placeholder.
%dev.captcha.secret=change-me-in-production
# How long a challenge stays valid (seconds)
captcha.challenge-ttl-seconds=300
# How long a solved token stays valid (seconds, default 1 hour)
captcha.token-ttl-seconds=3600

# Admin: SHA-256 hash of the admin password (ADMIN_PASSWORD_HASH in production). Blank turns the admin page off.
# admin.password-hash: unset by default
# dev password is password
%dev.admin.password-hash=5e884898da28047151d0e56f8dc6292773603d0d6aabbdd62a11ef721d1542d8

# Dev mode seeds a sample split (DevDataSeeder).
fairnsquare.dev.seed=false
%dev.fairnsquare.dev.seed=true
