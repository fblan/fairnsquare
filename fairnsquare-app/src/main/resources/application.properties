# FairNSquare Application Configuration

# Application Info
quarkus.application.name=fairnsquare
quarkus.application.version=1.0.0-SNAPSHOT
app.git.commit=${APP_GIT_COMMIT:unknown}

# JVM Options — headless AWT required for CAPTCHA image generation
quarkus.jvm-options=-Djava.awt.headless=true

# HTTP Configuration
quarkus.http.port=8080
quarkus.http.host=0.0.0.0

# CORS — origins must be provided via env var in prod; localhost entries are dev-only
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${FAIRNSQUARE_CORS_ORIGINS}
quarkus.http.cors.methods=GET,POST,DELETE,PATCH,OPTIONS
%dev.quarkus.http.cors.origins=http://localhost:5173,http://localhost:8080

# Health Checks
quarkus.smallrye-health.root-path=/q/health

# OpenAPI / Swagger UI
quarkus.smallrye-openapi.path=/q/openapi
quarkus.smallrye-openapi.info-title=FairNSquare API
quarkus.smallrye-openapi.info-version=${quarkus.application.version}
quarkus.smallrye-openapi.info-description=API for the FairNSquare expense splitting application
quarkus.swagger-ui.always-include=false
%dev.quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui

# Quinoa - Frontend SPA Configuration
quarkus.quinoa.dev-server.port=5173
quarkus.quinoa.enable-spa-routing=true
quarkus.quinoa.build-dir=dist

# =============================================================================
# Logging Configuration
# =============================================================================
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n

# =============================================================================
# Dev Profile
# =============================================================================
%dev.quarkus.log.console.json.enabled=false

# =============================================================================
# Test Profile
# =============================================================================
%test.quarkus.log.console.json.enabled=true
%test.quarkus.log.console.json.pretty-print=false

# =============================================================================
# Prod Profile
# =============================================================================
%prod.quarkus.log.console.json.enabled=true
%prod.quarkus.log.console.json.pretty-print=false

# =============================================================================
# Application Configuration
# =============================================================================
# Data storage path (configurable via env var)
fairnsquare.data.path=${FAIRNSQUARE_DATA_PATH:data}
%test.fairnsquare.data.path=test-data

# Storage constraints
fairnsquare.storage.max-file-count=${FAIRNSQUARE_MAX_FILE_COUNT:5000}
fairnsquare.storage.max-file-size-bytes=${FAIRNSQUARE_MAX_FILE_SIZE_BYTES:524288}
fairnsquare.storage.max-file-age-days=${FAIRNSQUARE_MAX_FILE_AGE_DAYS:90}
# Test profile: generous limits (tests create a small number of splits per run)
%test.fairnsquare.storage.max-file-count=1000
%test.fairnsquare.storage.max-file-size-bytes=524288
%test.fairnsquare.storage.max-file-age-days=30

# =============================================================================
# CAPTCHA Configuration
# =============================================================================
# HMAC-SHA256 signing secret for CAPTCHA tokens — required in prod via CAPTCHA_SECRET env var
# No default: Quarkus will refuse to start in prod if the env var is absent
captcha.secret=${CAPTCHA_SECRET}
# Dev and test use a known placeholder — never used in production
%dev.captcha.secret=change-me-in-production
%test.captcha.secret=change-me-in-test
# How long a challenge stays valid (seconds)
captcha.challenge-ttl-seconds=${CAPTCHA_CHALLENGE_TTL_SECONDS:300}
# How long a solved token stays valid (seconds, default 1 hour)
captcha.token-ttl-seconds=${CAPTCHA_TOKEN_TTL_SECONDS:3600}

# =============================================================================
# Admin Configuration
# =============================================================================
# SHA-256 hash of the admin password (set ADMIN_PASSWORD_HASH env var in production)
admin.password-hash=${ADMIN_PASSWORD_HASH:}
# Test password: 'test-admin-secret-fairnsquare' (sha256: b19eca9b698d7465f938dca5e4ce7feb6f814af893b81fc30ea790164191fa76)
%test.admin.password-hash=b19eca9b698d7465f938dca5e4ce7feb6f814af893b81fc30ea790164191fa76
# =============================================================================
# Container Image Configuration
# =============================================================================
# Build image: ./mvnw package -Dquarkus.container-image.build=true
# Push image:  ./mvnw package -Dquarkus.container-image.build=true -Dquarkus.container-image.push=true
quarkus.container-image.name=fairnsquare
quarkus.container-image.group=asymetrik
quarkus.container-image.tag=${quarkus.application.version}