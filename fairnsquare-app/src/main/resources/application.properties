# FairNSquare Application Configuration

# Application Info
quarkus.application.name=fairnsquare
quarkus.application.version=1.0.0-SNAPSHOT
app.git.commit=${APP_GIT_COMMIT:unknown}

# JVM Options — headless AWT required for CAPTCHA image generation
quarkus.jvm-options=-Djava.awt.headless=true

# HTTP Configuration
quarkus.http.port=8080
quarkus.http.host=0.0.0.0

# CORS — origins must be provided via env var in prod; localhost entries are dev-only
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${FAIRNSQUARE_CORS_ORIGINS}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
%dev.quarkus.http.cors.origins=http://localhost:8080

# Caching (#178) — the page and the web component scripts have no content hash in their names: the browser must
# revalidate them on each load (304 when unchanged), or after a deploy it mixes old and new modules.
quarkus.http.filter.revalidate.header."Cache-Control"=no-cache
quarkus.http.filter.revalidate.matches=/(?!api/|q/).*
quarkus.http.filter.revalidate.methods=GET,HEAD

# Health Checks
quarkus.smallrye-health.root-path=/q/health

# OpenAPI / Swagger UI
quarkus.smallrye-openapi.path=/q/openapi
quarkus.smallrye-openapi.info-title=FairNSquare API
quarkus.smallrye-openapi.info-version=${quarkus.application.version}
quarkus.smallrye-openapi.info-description=API for the FairNSquare expense splitting application
quarkus.swagger-ui.always-include=false
%dev.quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui

# =============================================================================
# Logging Configuration
# =============================================================================
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n

# =============================================================================
# Dev Profile
# =============================================================================
%dev.quarkus.log.console.json.enabled=false

# =============================================================================
# Test Profile
# =============================================================================
%test.quarkus.log.console.json.enabled=true
%test.quarkus.log.console.json.pretty-print=false

# =============================================================================
# Prod Profile
# =============================================================================
%prod.quarkus.log.console.json.enabled=true
%prod.quarkus.log.console.json.pretty-print=false

# =============================================================================
# Application Configuration
# =============================================================================
# Data storage path (configurable via env var)
fairnsquare.data.path=${FAIRNSQUARE_DATA_PATH:data}
%test.fairnsquare.data.path=test-data

# Storage constraints
fairnsquare.storage.max-file-count=${FAIRNSQUARE_MAX_FILE_COUNT:5000}
fairnsquare.storage.max-file-size-bytes=${FAIRNSQUARE_MAX_FILE_SIZE_BYTES:524288}
fairnsquare.storage.max-file-age-days=${FAIRNSQUARE_MAX_FILE_AGE_DAYS:90}
# Test profile: generous limits (tests create a small number of splits per run)
%test.fairnsquare.storage.max-file-count=1000
%test.fairnsquare.storage.max-file-size-bytes=524288
%test.fairnsquare.storage.max-file-age-days=30

# =============================================================================
# CAPTCHA Configuration
# =============================================================================
# HMAC-SHA256 signing secret for CAPTCHA tokens — required in prod via CAPTCHA_SECRET env var
# No default: Quarkus will refuse to start in prod if the env var is absent
captcha.secret=${CAPTCHA_SECRET}
# Dev and test use a known placeholder — never used in production
%dev.captcha.secret=change-me-in-production
%test.captcha.secret=change-me-in-test
# How long a challenge stays valid (seconds)
captcha.challenge-ttl-seconds=${CAPTCHA_CHALLENGE_TTL_SECONDS:300}
# How long a solved token stays valid (seconds, default 1 hour)
captcha.token-ttl-seconds=${CAPTCHA_TOKEN_TTL_SECONDS:3600}

# =============================================================================
# Admin Configuration
# =============================================================================
# SHA-256 hash of the admin password (set ADMIN_PASSWORD_HASH env var in production)
admin.password-hash=${ADMIN_PASSWORD_HASH:}
# Test password: 'test-admin-secret-fairnsquare' (sha256: b19eca9b698d7465f938dca5e4ce7feb6f814af893b81fc30ea790164191fa76)
%test.admin.password-hash=b19eca9b698d7465f938dca5e4ce7feb6f814af893b81fc30ea790164191fa76
# dev password is password
%dev.admin.password-hash=5e884898da28047151d0e56f8dc6292773603d0d6aabbdd62a11ef721d1542d8

# Admin sign-in with an OIDC provider, e.g. Pocket ID (#193). Set ADMIN_OIDC_ISSUER (the provider's URL),
# ADMIN_OIDC_CLIENT_ID and ADMIN_OIDC_CLIENT_SECRET, and the admin pages use the provider instead of the password;
# the provider's callback URL is https://<host>/api/admin/session/login. Without ADMIN_OIDC_ISSUER, the password is used.
quarkus.oidc.auth-server-url=${ADMIN_OIDC_ISSUER:}
quarkus.oidc.client-id=${ADMIN_OIDC_CLIENT_ID:}
quarkus.oidc.credentials.secret=${ADMIN_OIDC_CLIENT_SECRET:}
quarkus.oidc.application-type=web-app
# Pocket ID sends the user's groups in the ID token with the groups scope; they become the user's roles.
quarkus.oidc.authentication.scopes=profile,email,groups
# Optional: only the members of this provider group are admins (without it, everyone the provider signs in is).
admin.oidc.group=${ADMIN_OIDC_GROUP:}
# The provider's name on the sign-in button
admin.oidc.provider-name=${ADMIN_OIDC_PROVIDER_NAME:Pocket ID}
# The session cookie goes to the admin API only.
quarkus.oidc.authentication.cookie-path=/api/admin
# The admin page calls the API with fetch: an expired session answers 499, not a redirect to the provider.
quarkus.oidc.authentication.java-script-auto-redirect=false
# Behind the HTTPS reverse proxy, the app sees http: the callback URL must say https.
%prod.quarkus.oidc.authentication.force-redirect-https-scheme=true
%prod.quarkus.oidc.authentication.cookie-force-secure=true
# No Keycloak container in dev and test: OIDC is only on when configured.
quarkus.keycloak.devservices.enabled=false
# =============================================================================
# Container Image Configuration
# =============================================================================
# Build image: ./mvnw package -Dquarkus.container-image.build=true
# Push image:  ./mvnw package -Dquarkus.container-image.build=true -Dquarkus.container-image.push=true
quarkus.container-image.name=fairnsquare
quarkus.container-image.group=asymetrik
quarkus.container-image.tag=${quarkus.application.version}
